# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET
permissions:
  packages: write
  contents: write
on:
  push:
    branches: [ "main" ]
    tags:
      - v*
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # Publish builds the Svelte client (yarn install && yarn build), so it needs Node and yarn.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: MoiraiWebServer/ClientAppSvelte/yarn.lock
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Publish
      # Framework-dependent and run through `dotnet MoiraiWebServer.dll` (see release/run.*), so the one
      # zip works on every OS; an apphost built here would be a Linux binary that confuses everyone else.
      run: dotnet publish -c Release -p:UseAppHost=false MoiraiWebServer/MoiraiWebServer.csproj -o publish/moirai-${{ github.ref_name }}
    - name: Archive Release
      # Zipped from publish/ so the archive holds one moirai-<tag>/ folder, not the build's own path.
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      working-directory: publish
      run: zip -r ../moirai-${{ github.ref_name }}.zip moirai-${{ github.ref_name }}
    - name: Release
      uses: softprops/action-gh-release@v2
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        files: moirai-${{ github.ref_name }}.zip
